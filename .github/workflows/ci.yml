name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a rules deploy halfway; superseded PR checks are fine to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: huishouden/pwa-kit/actions/leak-scan@v0

  # Every rule is proven against the Firestore emulator: allowed reads/writes succeed, the rest fail.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/firebase/emulators
          key: ${{ runner.os }}-rules-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test

  # The project's single rules file and its indexes, deployed only from main after the tests pass.
  deploy:
    needs: [leak-scan, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bunx firebase deploy --only firestore:rules,firestore:indexes --project huishouden-piekstra --non-interactive --message "${{ github.sha }}"

  # The same rules on the staging project (pwa-kit STANDARD.md "Staging"), where app PRs run their
  # signed-in tests: on every same-repo PR, so a rules change can be tried with the apps before it
  # merges, and on main, so staging returns to main's rules. Never a fork's PR. Skipped until the
  # bootstrap's --staging pass sets STAGING_GCP_WIF_PROVIDER.
  deploy-staging:
    needs: [leak-scan, test]
    if: >-
      vars.STAGING_GCP_WIF_PROVIDER != '' && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: rules-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SA }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bunx firebase deploy --only firestore:rules,firestore:indexes --project huishouden-staging --non-interactive --message "staging ${{ github.event.pull_request.head.sha || github.sha }}"
